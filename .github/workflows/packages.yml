name: Packages

# For each published release: builds the Debian packages (amd64 and arm64), checks that they
# install and start on Ubuntu 22.04 and 24.04, attaches them to the release, and publishes the
# apt repository on GitHub Pages (gh-pages branch) with the packages of the last three releases.
#
# The apt repository needs the secret APT_GPG_PRIVATE_KEY: an ASCII-armored private key without
# a passphrase (see docs/RELEASES.md). Without it the packages are only attached to the release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (one that contains packaging/)
        required: true

permissions:
  contents: write

concurrency:
  group: packages
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  deb:
    name: Debian packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build MITI (standalone)
        run: npm run build
        env:
          STANDALONE_BUILD: 'true'
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Install nfpm
        run: |
          packaging/install-nfpm.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build packages
        run: |
          packaging/build-deb.sh amd64
          packaging/build-deb.sh arm64

      - name: Install and start on Ubuntu 22.04 and 24.04
        run: |
          for version in 22.04 24.04; do
            echo "Ubuntu $version"
            docker run --rm -v "$PWD/dist:/dist:ro" "ubuntu:$version" bash -c '
              set -e
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl /dist/miti_*_amd64.deb >/dev/null
              su -s /bin/sh miti -c miti >/tmp/miti.log 2>&1 &
              for i in $(seq 1 30); do
                curl -sf -o /dev/null localhost:3000 && exit 0
                sleep 1
              done
              cat /tmp/miti.log
              exit 1'
          done

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.deb --clobber

      - name: Publish the apt repository
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::warning::Add the APT_GPG_PRIVATE_KEY secret to publish the apt repository (see docs/RELEASES.md)."
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"

          # The packages of the last three releases that have them, newest first.
          debs="$RUNNER_TEMP/debs"
          mkdir -p "$debs"
          found=0
          for tag in $(gh release list --limit 30 --exclude-drafts --json tagName --jq '.[].tagName'); do
            if gh release download "$tag" --pattern 'miti_*.deb' --dir "$debs" 2>/dev/null; then
              found=$((found + 1))
              [ "$found" -ge 3 ] && break
            fi
          done
          packaging/build-apt-repo.sh "$RUNNER_TEMP/apt" "$key" "$debs"/*.deb

          # One commit, replaced each time, so old packages do not pile up in the history.
          cd "$RUNNER_TEMP/apt"
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "apt repository for MITI $TAG"
          git push --force --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
