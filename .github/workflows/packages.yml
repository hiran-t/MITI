name: Packages

# Builds the Debian packages for amd64 and arm64, each on a runner of its own architecture, and
# tests them in clean Ubuntu 22.04 and 24.04 containers (packaging/test-deb.sh). This runs for
# every change that can affect them, so a broken amd64 or arm64 package shows up before a release.
#
# For a published release (or a run of this workflow with a tag) it then attaches the packages to
# the release and publishes the apt repository on GitHub Pages (gh-pages branch) with the packages
# of the last three releases. The apt repository needs the secret APT_GPG_PRIVATE_KEY: an
# ASCII-armored private key without a passphrase (see docs/develop/releases.md).

on:
  push:
    branches: [ main ]
    paths: &package-paths
      - 'packaging/**'
      - 'scripts/start-miti.mjs'
      - 'scripts/bridge-settings.mjs'
      - 'ros/foxglove-bridge.sh'
      - 'ros/cyclonedds.xml'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - '.github/workflows/packages.yml'
  pull_request:
    branches: [ main ]
    paths: *package-paths
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package and publish (empty to only build and test this branch)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build MITI (standalone)
        run: npm run build
        env:
          STANDALONE_BUILD: 'true'
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Install nfpm
        run: |
          packaging/install-nfpm.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build the package
        run: packaging/build-deb.sh ${{ matrix.arch }}

      - name: Test on Ubuntu 22.04 and 24.04
        run: |
          deb="$(ls dist/miti_*_${{ matrix.arch }}.deb)"
          for version in 22.04 24.04; do
            docker run --rm -v "$PWD:/src:ro" "ubuntu:$version" bash /src/packaging/test-deb.sh "/src/$deb"
          done

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          retention-days: 14

  publish:
    name: Attach and publish
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Get the packages
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.deb --clobber

      - name: Publish the apt repository
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::warning::Add the APT_GPG_PRIVATE_KEY secret to publish the apt repository (see docs/develop/releases.md)."
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"

          # The packages of the last three releases that have them, newest first. Only releases
          # from v3.3.5 on: older ones (v1.0.0's desktop app) attached other .deb files.
          debs="$RUNNER_TEMP/debs"
          mkdir -p "$debs"
          found=0
          for tag in $(gh release list --limit 30 --exclude-drafts --json tagName --jq '.[].tagName'); do
            version="${tag#v}"
            [ "$(printf '%s\n' 3.3.5 "$version" | sort -V | head -n 1)" = 3.3.5 ] || continue
            if gh release download "$tag" --pattern "miti_${version}_*.deb" --dir "$debs" 2>/dev/null; then
              found=$((found + 1))
              [ "$found" -ge 3 ] && break
            fi
          done
          packaging/build-apt-repo.sh "$RUNNER_TEMP/apt" "$key" "$debs"/*.deb

          # One commit, replaced each time, so old packages do not pile up in the history.
          cd "$RUNNER_TEMP/apt"
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "apt repository for MITI $TAG"
          git push --force --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
