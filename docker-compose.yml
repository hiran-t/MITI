version: '3.8'

services:
  # MITI Web Application
  miti-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miti-web
    ports:
      - "3000:3000"
    environment:
      # Point this at your ROS2 machine running foxglove_bridge
      # If using the foxglove-bridge service below, keep ws://foxglove-bridge:8765
      # If using an external robot, change to ws://<robot-ip>:8765
      - NEXT_PUBLIC_BRIDGE_URL=ws://foxglove-bridge:8765
    networks:
      - miti-network
    restart: unless-stopped

  # foxglove_bridge (optional)
  # Uncomment to run foxglove_bridge inside Docker alongside MITI
  # Note: requires a running ROS2 environment on the host
  # Use ros:jazzy for Jazzy; $$ROS_DISTRO is escaped so the container's value is used
  # foxglove-bridge:
  #   image: ros:humble
  #   container_name: miti-foxglove-bridge
  #   command: >
  #     bash -c "
  #       apt-get update &&
  #       apt-get install -y ros-$$ROS_DISTRO-foxglove-bridge &&
  #       source /opt/ros/$$ROS_DISTRO/setup.bash &&
  #       ros2 launch foxglove_bridge foxglove_bridge_launch.xml
  #     "
  #   ports:
  #     - "8765:8765"
  #   networks:
  #     - miti-network
  #   restart: unless-stopped

networks:
  miti-network:
    driver: bridge

# Usage:
# 1. Build and start all services:
#    docker-compose up -d
#
# 2. View logs:
#    docker-compose logs -f
#
# 3. Stop all services:
#    docker-compose down
#
# 4. Rebuild after code changes:
#    docker-compose up -d --build
