# MITI as a service. Settings come from a .env file beside this one (see .env.example).
#
#   docker compose up -d                    MITI only, connecting to foxglove_bridge on the
#                                           robot or wherever the browser points it
#   docker compose --profile bridge up -d   MITI plus foxglove_bridge on this machine, joined
#                                           to the robot's ROS 2 network over DDS
#   docker compose logs -f                  follow the logs
#   docker compose down                     stop
#   docker compose up -d --build            rebuild after updating MITI
#
# Both services restart with the machine (restart: unless-stopped) once Docker starts at boot.

services:
  miti:
    build:
      context: .
      args:
        # Empty: browsers connect to ws://<this machine>:8765, where the bridge service listens.
        NEXT_PUBLIC_BRIDGE_URL: ${NEXT_PUBLIC_BRIDGE_URL:-}
    image: miti:latest
    container_name: miti
    environment:
      # Tells the page which port the bridge service listens on.
      MITI_BRIDGE_PORT: ${BRIDGE_PORT:-8765}
    ports:
      - '${MITI_PORT:-3000}:3000'
    restart: unless-stopped

  foxglove-bridge:
    profiles: [bridge]
    build:
      context: ./ros
      args:
        ROS_DISTRO: ${ROS_DISTRO:-humble}
    image: miti-foxglove-bridge:${ROS_DISTRO:-humble}
    container_name: miti-foxglove-bridge
    # DDS discovers the robot by multicast on the real network, and Fast DDS uses shared memory
    # with ROS nodes on the same machine; both need the host's network and IPC namespaces.
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # Jazzy: the robot's IP(s), separated by ';', for discovery without multicast (Wi-Fi)
      ROS_STATIC_PEERS: ${ROS_STATIC_PEERS:-}
      BRIDGE_PORT: ${BRIDGE_PORT:-8765}
      BRIDGE_TOPIC_WHITELIST: ${BRIDGE_TOPIC_WHITELIST:-['.*']}
      BRIDGE_SEND_BUFFER_LIMIT: ${BRIDGE_SEND_BUFFER_LIMIT:-10000000}
    restart: unless-stopped
